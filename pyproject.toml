[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candybar"
version = "0.1.0"
description = "Event-driven cron framework for the 33GOD pipeline: heartbeat-and-dispatch over Bloodbank"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "nats-py==2.16.0",
    "croniter==6.2.4",
    "psycopg==3.3.6",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "prometheus-client==0.26.0",
    "pydantic==2.14.1",
    "typer==0.27.3",
    "pyyaml==6.0.3",
]

[project.scripts]
candybar = "candybar.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.16",  # FastAPI TestClient transport; never a runtime dep (spine pins stay exact)
    "candybar-sdk",  # story 4.1: the python SDK, editable from sdks/python (tests + example)
]

[tool.uv.sources]
candybar-sdk = { path = "sdks/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/candybar"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
# Lint only what this repo owns; template-managed tooling dirs are excluded.
extend-exclude = [".mise", ".agents", "_bmad", "_bmad-output"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
