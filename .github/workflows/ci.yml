# Lint + unit tests for candybar.
#
# Runner: GitHub-hosted `ubuntu-latest`. This repo is PUBLIC, so hosted
# minutes are free (AD-15/NFR12 pin CI to GitHub-hosted runners). The
# self-hosted runner rule applies only to private repos — do not "fix" this
# to the delonet labels; that change would leave every job queued forever.
#
# The commands here mirror the local verification loop: ruff + pytest over
# the uv-managed pinned stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Registry integration tests (story 1.4). postgres:17-alpine matches the
      # live shared homelab Postgres (17.10).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: candybar
          POSTGRES_PASSWORD: candybar
          POSTGRES_DB: candybar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candybar -d candybar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Story 4.2: Node SDK toolchain (spine floor: Node 24 LTS, pinned).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Console script smoke (installed entry point)
        run: uv run candybar --help

      - name: Daemon subcommand smoke
        run: |
          uv run candybar daemon --help
          if uv run candybar daemon --roles bogus; then
            echo "expected --roles bogus to fail" >&2
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      # Story 4.2: candybar-sdk (npm). node:test over the protocol matrix and
      # the no-network guards, tsc over the hand-written .d.ts, and an empty
      # production dependency tree (nothing in it could open a NATS socket).
      - name: Node SDK tests + typecheck (sdks/node)
        working-directory: sdks/node
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          test "$(npm ls --omit=dev --all --parseable | wc -l)" -eq 1

      # Story 1.9: AD-15 grep gate — no LAN IPs or plaintext-secret shapes on
      # deploy surfaces, enforced on every push. ripgrep is not guaranteed on
      # the runner image (Ubuntu 26 dropped it) — install it; the script
      # exit(2)s loudly if rg is missing so the gate can never pass vacuously.
      - name: Deploy hygiene gate (no LAN IPs / plaintext secrets)
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          bash scripts/check-deploy-hygiene.sh

      # Story 1.9: the deployment envelope must build on every push. The
      # image entrypoint migrates the registry first, so the CLI smoke
      # bypasses it with --entrypoint (no database in this job).
      - name: Docker image build
        run: |
          docker build -t candybar:ci .
          docker run --rm --entrypoint /app/.venv/bin/candybar candybar:ci --help >/dev/null
          docker run --rm --entrypoint node candybar:ci --version
          # Story 4.2: a node-SDK candybar runs inside the image the way the
          # executor spawns it (direct exec via shebang, AD-8 env in).
          docker run --rm --entrypoint sh -v "$PWD/sdks/node:/sdk:ro" \
            -e CANDYBAR_INVOCATION_ID=ci -e CANDYBAR_ID=ci -e CANDYBAR_TRIGGER=manual \
            -e CANDYBAR_TICK_ID= -e CANDYBAR_RESULT_FILE=/tmp/result.json candybar:ci \
            -c '/sdk/examples/hello-node/candybar.mjs && grep -q "\"status\":\"success\"" /tmp/result.json'
          # Story 4.1: SDK-authored python jobs import candybar_sdk from the image venv.
          docker run --rm --entrypoint python candybar:ci -c "import candybar_sdk"

      # CANDYBAR_REQUIRE_NODE: the node-SDK contract suite must run, never skip.
      - name: Unit tests
        run: CANDYBAR_REQUIRE_NODE=1 uv run pytest -q

      # Story 3.1: real cgroup v2 canaries — a 64 MiB allocation must report a
      # memory.peak inside the asserted band and a one-core busy loop a CPU
      # load near 1.0. Root creates a cgroup under the runner hierarchy.
      - name: Cgroup metering canaries (real cgroup v2, as root)
        run: |
          sudo mkdir -p /sys/fs/cgroup/candybar-ci
          sudo env PYTHONDONTWRITEBYTECODE=1 CANDYBAR_TEST_CGROUP_ROOT=/sys/fs/cgroup/candybar-ci \
            .venv/bin/python -m pytest -p no:cacheprovider -q -rs tests/test_cgroup_metering_integration.py

      # Story 1.7: the documented per-candybar PromQL (success/fail rate,
      # failure ratio, runtime) evaluated by promtool, pinned to the live
      # Prometheus version.
      - name: PromQL tests (promtool)
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/w:ro" --entrypoint promtool
          prom/prometheus:v3.5.0 test rules /w/candybar-queries.test.yml

      # JetStream integration tests (story 1.3): run a pinned nats-server
      # matching the live bloodbank-nats version, with JetStream enabled.
      - name: Install NATS server
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.29/nats-server-v2.10.29-linux-amd64.tar.gz | tar xz
          sudo install -m 0755 nats-server-v2.10.29-linux-amd64/nats-server /usr/local/bin/nats-server

      - name: Start NATS with JetStream
        run: |
          nats-server -js --port 4222 &
          timeout 15 bash -c 'until (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; do sleep 0.5; done'

      - name: Integration tests (live NATS)
        run: CANDYBAR_TEST_NATS=1 uv run pytest tests/test_heartbeat_integration.py tests/test_dispatcher_integration.py -q
        env:
          NATS_URL: nats://127.0.0.1:4222

      # Registry migrations against the postgres service — proven in CI on
      # every push, not just locally.
      - name: Alembic upgrade head (registry schema)
        run: uv run alembic -c deploy/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql://candybar:candybar@127.0.0.1:5432/candybar_test

      - name: Integration tests (live Postgres)
        run: CANDYBAR_TEST_PG=1 uv run pytest tests/test_registry_integration.py -q
        env:
          DATABASE_URL: postgresql://candybar:candybar@127.0.0.1:5432/candybar_test

      # Story 2.1: effectively-once dispatch under fault injection — the
      # production dispatcher + executor roles over the CI nats-server and
      # Postgres, with tick redelivery, command redelivery and a dispatcher
      # death mid-tick. It resets the BLOODBANK_* streams (throwaway bus only;
      # it refuses foreign traffic) and leaves them empty for the steps below.
      - name: "Integration tests (dispatch fault injection: live NATS + Postgres)"
        run: CANDYBAR_TEST_NATS=1 CANDYBAR_TEST_PG=1 CANDYBAR_TEST_FAULT=1 uv run pytest tests/test_dispatch_fault_injection_integration.py -q
        env:
          NATS_URL: nats://127.0.0.1:4222
          DATABASE_URL: postgresql://candybar:candybar@127.0.0.1:5432/candybar_test

      # Executor end-to-end (story 1.6): real command off JetStream, real
      # script spawn, real registry rows + counters; story 1.8 adds the manual
      # invoke through the real API onto the same path. Needs both services,
      # which are both up by this point in the job. Story 1.9 adds the
      # fast-stop proof (roles stop inside docker's 10s SIGTERM grace).
      # Story 4.1 adds the python-SDK example firing off a scheduled tick.
      - name: "Integration tests (executor + manual invoke + fast stop + python/node SDK: live NATS + Postgres)"
        run: CANDYBAR_TEST_NATS=1 CANDYBAR_TEST_PG=1 uv run pytest tests/test_executor_integration.py tests/test_manual_invoke_integration.py tests/test_fast_stop_integration.py tests/test_sdk_python_integration.py tests/test_node_sdk_integration.py -q
        env:
          NATS_URL: nats://127.0.0.1:4222
          DATABASE_URL: postgresql://candybar:candybar@127.0.0.1:5432/candybar_test

      # Story 1.9: boot the real image end-to-end in CI — the entrypoint
      # migrates, all four roles connect, /healthz answers, and docker stop
      # completes inside the 10s grace. Runs last so the integration step
      # above has already created the BLOODBANK_* streams the roles attach.
      - name: Container boot smoke (image vs CI services)
        run: |
          # Privileged + private cgroupns, as deploy/compose.yml: the
          # entrypoint must delegate the per-invocation scope tree (3.1).
          docker run -d --name candybar-ci --network host \
            --privileged --cgroupns=private \
            -e NATS_URL=nats://127.0.0.1:4222 \
            -e DATABASE_URL=postgresql://candybar:candybar@127.0.0.1:5432/candybar_test \
            candybar:ci
          healthy=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8700/healthz | grep -q ok; then healthy=1; break; fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            docker logs candybar-ci || true
            echo "container never became healthy" >&2
            exit 1
          fi
          docker exec candybar-ci cat /sys/fs/cgroup/candybar/cgroup.subtree_control | tee /dev/stderr | grep -q memory
          docker exec candybar-ci sh -c 'grep -q "^Uid:[[:space:]]*10001" /proc/1/status'
          START=$(date +%s%N); docker stop candybar-ci >/dev/null; END=$(date +%s%N)
          ELAPSED_MS=$(( (END - START) / 1000000 ))
          echo "docker stop took ${ELAPSED_MS}ms"
          docker rm candybar-ci >/dev/null
          [ "$ELAPSED_MS" -lt 9500 ]
