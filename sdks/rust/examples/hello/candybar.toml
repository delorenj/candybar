# Example rust candybar (Story 4.3). Build it, then register it:
#   cargo build --release --manifest-path sdks/rust/examples/hello/Cargo.toml
#   candybar register sdks/rust/examples/hello
# The executor execs `entrypoint` directly, so it points at the compiled
# binary. A relative entrypoint resolves against this file's directory.
[candybar]
name = "hello-rust"
description = "Rust SDK example: reports its trigger and a self-reported token spend."
tags = ["example", "sdk", "rust"]
schedule = "* * * * *"
entrypoint = "target/release/candybar-hello"
noise = true
