# promtool unit test for the Candybar PromQL documented in README.md (Story 1.7).
#
#   docker run --rm -v "$PWD/deploy/prometheus:/w" --entrypoint promtool \
#     prom/prometheus:v3.5.0 test rules /w/candybar-queries.test.yml
#
# Input series use the exporter's exact names and label set ({candybar_id,
# result} only); tests/test_metrics.py fails if they drift from the code.
rule_files: []

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # candybar A: one success per minute, one failure every other minute.
      - series: 'candybar_invocations_total{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+1x10'
      - series: 'candybar_invocations_total{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="fail"}'
        values: '0 0 1 1 2 2 3 3 4 4 5'
      # candybar B: only successes. The exporter materializes the fail series
      # at zero on first observation, so the ratio below yields 0, not no-data.
      - series: 'candybar_invocations_total{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '0+2x10'
      - series: 'candybar_invocations_total{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="fail"}'
        values: '0x10'
      # runtime histogram for A: every observation lands in the 500ms bucket.
      - series: 'candybar_invocation_runtime_milliseconds_bucket{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success",le="250"}'
        values: '0x10'
      - series: 'candybar_invocation_runtime_milliseconds_bucket{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success",le="500"}'
        values: '0+1x10'
      - series: 'candybar_invocation_runtime_milliseconds_bucket{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success",le="+Inf"}'
        values: '0+1x10'
      - series: 'candybar_invocation_runtime_milliseconds_count{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+1x10'
      - series: 'candybar_invocation_runtime_milliseconds_sum{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+400x10'

    promql_expr_test:
      # Success vs fail rate per candybar (per second over 10m).
      - expr: sum by (candybar_id, result) (increase(candybar_invocations_total[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
            value: 10
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="fail"}'
            value: 5
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
            value: 20
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="fail"}'
            value: 0

      # Failure ratio per candybar.
      - expr: |
          sum by (candybar_id) (rate(candybar_invocations_total{result="fail"}[10m]))
            / sum by (candybar_id) (rate(candybar_invocations_total[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 0.3333333333333333
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b"}'
            value: 0

      # Mean runtime (ms) per candybar and result.
      - expr: |
          sum by (candybar_id, result) (rate(candybar_invocation_runtime_milliseconds_sum[10m]))
            / sum by (candybar_id, result) (rate(candybar_invocation_runtime_milliseconds_count[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
            value: 400

      # p95 runtime (ms) per candybar.
      - expr: |
          histogram_quantile(0.95,
            sum by (candybar_id, le) (rate(candybar_invocation_runtime_milliseconds_bucket[10m])))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 487.5

  # Story 3.1: memory hogs and CPU burners per candybar.
  - interval: 1m
    input_series:
      # Gauge = the latest invocation's memory.peak. A spikes to 300 MiB once.
      - series: 'candybar_invocation_memory_peak_bytes{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '104857600 314572800 125829120 104857600 104857600 104857600 104857600 104857600 104857600 104857600 104857600'
      - series: 'candybar_invocation_memory_peak_bytes{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '52428800x10'
      # CPU-load histogram: A averages half a core, B two cores.
      - series: 'candybar_invocation_cpu_load_ratio_sum{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+0.5x10'
      - series: 'candybar_invocation_cpu_load_ratio_count{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+1x10'
      - series: 'candybar_invocation_cpu_load_ratio_sum{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '0+2x10'
      - series: 'candybar_invocation_cpu_load_ratio_count{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '0+1x10'

    promql_expr_test:
      # Worst memory peak per candybar over the window (bytes).
      - expr: max by (candybar_id) (max_over_time(candybar_invocation_memory_peak_bytes[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 314572800
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b"}'
            value: 52428800

      # The single biggest memory hog.
      - expr: topk(1, max by (candybar_id) (max_over_time(candybar_invocation_memory_peak_bytes[10m])))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 314572800

      # Average CPU load (busy cores) per candybar.
      - expr: |
          sum by (candybar_id) (rate(candybar_invocation_cpu_load_ratio_sum[10m]))
            / sum by (candybar_id) (rate(candybar_invocation_cpu_load_ratio_count[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 0.5
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b"}'
            value: 2

  # Story 3.2: GPU burners per candybar (nvidia-smi pmon SM load, busy GPUs).
  - interval: 1m
    input_series:
      # A is a GPU job averaging 0.75 of one GPU; B runs on CPU only (observes 0).
      - series: 'candybar_invocation_gpu_load_ratio_sum{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+0.75x10'
      - series: 'candybar_invocation_gpu_load_ratio_count{candybar_id="0199a1b2-0000-7000-8000-00000000000a",result="success"}'
        values: '0+1x10'
      - series: 'candybar_invocation_gpu_load_ratio_sum{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '0x10'
      - series: 'candybar_invocation_gpu_load_ratio_count{candybar_id="0199a1b2-0000-7000-8000-00000000000b",result="success"}'
        values: '0+1x10'

    promql_expr_test:
      # Average GPU load (busy GPUs) per candybar; a GPU-less job reads 0, not no data.
      - expr: |
          sum by (candybar_id) (rate(candybar_invocation_gpu_load_ratio_sum[10m]))
            / sum by (candybar_id) (rate(candybar_invocation_gpu_load_ratio_count[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 0.75
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000b"}'
            value: 0

      # Candybars that actually use the GPU (> 5% of one GPU on average).
      - expr: |
          sum by (candybar_id) (rate(candybar_invocation_gpu_load_ratio_sum[10m]))
            / sum by (candybar_id) (rate(candybar_invocation_gpu_load_ratio_count[10m])) > 0.05
        eval_time: 10m
        exp_samples:
          - labels: '{candybar_id="0199a1b2-0000-7000-8000-00000000000a"}'
            value: 0.75
