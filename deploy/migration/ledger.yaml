- id: crontab:22
  wave: '7.9'
  candybar:
    name: sync-vault-to-drive
    description: rclone sync of the DeLoDocs vault (~/d) to gdrive:ObsidianVault with flock, 100m self-timeout and vox announcements
    tags:
    - migrated
    - vault
    schedule: 30 */2 * * *
    timezone: America/New_York
    runner:
      kind: exec
      argv:
      - /home/delorenj/.local/bin/sync-vault-to-drive
      workdir: /home/delorenj
      env: {}
      timeout_s: 7200
  native:
    kind: crontab
    schedule: 30 */2 * * * /home/delorenj/.local/bin/sync-vault-to-drive  (user crontab line 22; system local time, no CRON_TZ)
    jitter_s: 0
    line: 30 */2 * * * /home/delorenj/.local/bin/sync-vault-to-drive
    cron: 30 */2 * * *
    timezone: America/New_York
  deviations:
  - cron evaluated the line in system local time with no CRON_TZ; the candybar pins America/New_York explicitly (same zone today)
  - flock moves from /tmp to $XDG_RUNTIME_DIR (set under the systemd user manager, unset under cron); safe because the crontab line is removed in the same cutover
  - the script announces start/finish/failure itself via notify-vox.sh, so no candybar on_failure hook
  native_failing: false
  source_of_truth:
    repo: delorenj/zshyzsh
    path: scripts/sync-vault-to-drive.sh
    commit: d0e7c4e2400b1d2587d50699cf8844f7f948ce42
  disable:
  - crontab -l | { grep -vxF -- '30 */2 * * * /home/delorenj/.local/bin/sync-vault-to-drive' || true; } | crontab -
  - rm -f /home/delorenj/.config/systemd/user/sync-vault.service /home/delorenj/.config/systemd/user/sync-vault.timer
  - systemctl --user daemon-reload
  rollback:
  - crontab -l 2>/dev/null | grep -qxF -- '30 */2 * * * /home/delorenj/.local/bin/sync-vault-to-drive' || { { crontab -l 2>/dev/null || true; printf '%s\n' '30 */2 * * * /home/delorenj/.local/bin/sync-vault-to-drive'; } | crontab -; }
  status: planned
  candybar_id: null
  cutover_at: null
  verification:
    invocation_id: null
    result: null
    at: null
  disable_pending: false
  history:
  - at: '2026-10-26T17:20:00Z'
    action: plan
    outcome: note
    detail: 'The crontab line was hand-edited (no installer writes it; zshyzsh''s op-token-sync only manages the BASH_ENV header, which this job never used). Commit d0e7c4e records the candybar scheduling in the script header. The stale, never-enabled sync-vault.{service,timer} (untracked, disabled since May) are deleted by the disable commands so no third scheduler can be re-enabled; skillex folder-curator/references/ drive-sync.md no longer cites them (delorenj/skills dfc5deb, skillex db71277). External side effects (rclone sync deletes remote extraneous files): NEVER `candybar run` to test — first scheduled fire is the proof.'
