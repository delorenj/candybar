# Candybar migration ledger (Story 7.5, AD-21): one entry per cron-inventory id.
# Driven by `candybar migrate {plan,cutover,verify,rollback,status}`; schema and
# procedure in deploy/migration/README.md. Commit it after every change: it is
# how a cutover is undone when the daemon is down.
version: 1
jobs:
- id: systemd:newapi-allowances
  wave: '7.13'
  candybar:
    name: newapi-allowances
    description: Collect read-only AutomaticAI provider subscription allowances
    tags:
    - migrated
    - automaticai
    schedule: '*/5 * * * *'
    timezone: UTC
    runner:
      kind: systemd
      unit: newapi-allowances.service
  native:
    kind: systemd-timer
    schedule: OnBootSec=1m; OnActiveSec=1m; OnUnitActiveSec=5m; RandomizedDelaySec=15s; Persistent=true
    jitter_s: 15
    unit: newapi-allowances.timer
    unit_file: /home/delorenj/code/client-portal/gateway/ops/systemd/newapi-allowances.timer
  deviations:
  - RandomizedDelaySec=15s dropped
  - OnBootSec/OnActiveSec boot re-arm dropped
  - Persistent=true catch-up replaced by candybar misfire policy
  native_failing: false
  source_of_truth:
    repo: AutomaticAI-io/client-portal
    path: gateway/ops/systemd/newapi-allowances.timer
    commit: null
  disable:
  - systemctl --user disable --now newapi-allowances.timer
  rollback:
  - systemctl --user enable --now /home/delorenj/code/client-portal/gateway/ops/systemd/newapi-allowances.timer
  status: planned
  candybar_id: null
  cutover_at: null
  verification:
    invocation_id: null
    result: null
    at: null
  disable_pending: false
  history:
  - at: '2026-10-26T17:15:39.722006Z'
    action: plan
    outcome: written
    detail: default disable/rollback commands for systemd-timer
