# Migrated from systemd:gnome-shell-restart.timer (wave 7.7). The .service unit stays exactly as it is
# in ~/code/infra/systemd/user/; only its timer retired. Cutover record:
# deploy/migration/ledger.yaml.
[candybar]
name = "gnome-shell-restart"
description = "Hourly check that restarts GNOME Shell when it holds more than 100k open file handles (migrated from gnome-shell-restart.timer)"
tags = ["migrated", "infra"]
schedule = "0 * * * *"
timezone = "America/New_York"

[candybar.runner]
kind = "systemd"
unit = "gnome-shell-restart.service"
