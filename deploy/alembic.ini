# Alembic config for the candybar registry (AD-10).
# Run from the repo root:  uv run alembic -c deploy/alembic.ini upgrade head
# The DSN comes from DATABASE_URL (never written here); see deploy/alembic/env.py.

[alembic]
script_location = deploy/alembic
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
